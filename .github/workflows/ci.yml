name: Expense tracker CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, test, security, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check dependencies for vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Skip deploy if Vercel secrets are missing
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "Skipping Vercel deployment because one or more required secrets are not configured."

      - name: Deploy
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          npx vercel@latest pull --yes --environment=production --token="${{ env.VERCEL_TOKEN }}"
          npx vercel@latest deploy --prod --token="${{ env.VERCEL_TOKEN }}"
